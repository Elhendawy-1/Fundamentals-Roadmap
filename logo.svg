<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d2ff"/>
      <stop offset="1" stop-color="#3a7bd5"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12122a"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#bgGrad)" stroke="url(#grad)" stroke-width="3"/>

  <!-- Code brackets -->
  <path d="M38 30 L26 44 L38 58" fill="none" stroke="#00d2ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M58 30 L70 44 L58 58" fill="none" stroke="#3a7bd5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M54 28 L42 60" fill="none" stroke="url(#grad)" stroke-width="7" stroke-linecap="round"/>

  <!-- Roadmap track -->
  <path d="M24 76 H72" fill="none" stroke="#2a2a4a" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>

  <!-- Roadmap nodes -->
  <circle cx="24" cy="76" r="5.5" fill="#00d2ff"/>
  <circle cx="48" cy="76" r="5.5" fill="#3a7bd5" stroke="#0a0a1a" stroke-width="1.5"/>
  <circle cx="72" cy="76" r="6.5" fill="#fff" stroke="url(#grad)" stroke-width="3"/>
  <path d="M69.5 76 l1.8 1.8 3.2-3.6" fill="none" stroke="#00c853" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
